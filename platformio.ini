; ESP-Router — WiFi repeater + router-style admin panel
; Target boards: classic ESP32 DevKit (4MB) and ESP32-C5 DevKit N8 (8MB)
;
; Build:   pio run -e esp32dev
; Upload:  pio run -e esp32dev -t upload
; FS:      pio run -e esp32dev -t uploadfs
;
; C5 build: pio run -e esp32c5

[platformio]
default_envs = esp32dev
src_dir = src
data_dir = data
; Windows long-path workaround: the ESP32 Arduino libs archive contains paths
; that exceed 260 characters inside the default ~/.platformio cache. Point the
; download/extract cache at a short root instead.
cache_dir = C:/pio-cache

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.embed_files =
    data/index.html
    data/portal.html
    data/assets/app.css
    data/assets/app.js
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    mathieucarbou/AsyncTCP@^3.3.2
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DESP_ROUTER_VERSION=\"0.2.1\"
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------
; Classic ESP32 (ESP32-WROOM-32 DevKit) — 4MB flash, 2.4GHz only
; ---------------------------------------------------------------
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions/esp32_4mb_ota.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; ---------------------------------------------------------------
; ESP32-C5 DevKit N8 — 8MB flash, dual-band WiFi 6
; ---------------------------------------------------------------
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.partitions = partitions/esp32c5_8mb_ota.csv
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
